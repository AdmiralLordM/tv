<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal Velocity viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #12110f; color: #e6e0d4; font: 13px/1.4 ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 8px 12px; background: #1c1915; border-bottom: 1px solid #3a3328;
  }
  a { color: #f0d7a2; }
  select, button, input[type="range"] { font: inherit; }
  select, button { background: #2a241c; color: #e6e0d4; border: 1px solid #3a3328; padding: 4px 8px; }
  label { display: flex; align-items: center; gap: 6px; color: #b5aa98; }
  #stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    container-type: size;
    background: #070605;
  }
  #frame {
    position: relative;
    aspect-ratio: 800 / 600;
    width: min(100cqw, calc(100cqh * 800 / 600));
  }
  #frame > canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  #status { color: #b5aa98; }
  #error { color: #e07070; }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%;
    aspect-ratio: 320 / 64; z-index: 2; pointer-events: none;
  }
  #hud[hidden] { display: none; }
  #hud img, #hud canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: auto;
  }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 2;
  }
  #crosshair[hidden] { display: none; }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(210, 230, 200, 0.9);
  }
  #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <a href="index.html">Assets</a>
  <select id="mode">
    <option value="map">Map</option>
    <option value="model">Model</option>
  </select>
  <select id="pick"></select>
  <label id="heightLabel">Relief <input id="relief" type="range" min="0.15" max="3" step="0.05" value="0.4"></label>
  <button id="fly" type="button">Fly</button>
  <span id="status"></span>
  <span id="error"></span>
</header>
<div id="stage">
  <div id="frame">
    <div id="hud" hidden>
      <img src="screens/statbar.png?v=2" alt="">
      <canvas id="hudText" width="320" height="64"></canvas>
    </div>
    <div id="crosshair" hidden></div>
  </div>
</div>
<script type="module" src="viewer.js?v=35"></script>
</body>
</html>
