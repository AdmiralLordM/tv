<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<link rel="manifest" href="manifest.json">
<link rel="icon" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Terminal Velocity</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #12110f; color: #e6e0d4; font: 13px/1.4 ui-monospace, monospace; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    padding: 8px 12px; background: #1c1915; border-bottom: 1px solid #3a3328;
  }
  a { color: #f0d7a2; }
  select, button { font: inherit; background: #2a241c; color: #e6e0d4; border: 1px solid #3a3328; padding: 4px 8px; }
  #status { color: #b5aa98; }
  #error { color: #e07070; }
  #stage {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    container-type: size;
    background: #070605;
  }
  #frame {
    position: relative;
    aspect-ratio: 800 / 600;
    width: min(100cqw, calc(100cqh * 800 / 600));
  }
  #frame > canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated;
  }
  #hud {
    position: absolute; top: 0; left: 0; width: 100%;
    aspect-ratio: 320 / 64; z-index: 2; pointer-events: none;
  }
  #hud[hidden], #crosshair[hidden] { display: none; }
  #hud canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
  }
  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 14px; height: 14px;
    transform: translate(-50%, -50%); pointer-events: none; z-index: 2;
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(210, 230, 200, 0.9);
  }
  #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
  #setup {
    position: absolute; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    background: rgba(7, 6, 5, 0.92);
  }
  #setup[hidden], #forget[hidden] { display: none; }
  #setup .card {
    max-width: 30em; margin: 16px; padding: 20px 24px;
    border: 1px dashed #5a4f3e; background: #1c1915; line-height: 1.6;
  }
  #setup h1 { margin: 0 0 8px; font-size: 16px; color: #f0d7a2; }
  #setup p { margin: 0 0 12px; color: #b5aa98; }
  #setup code { color: #e6e0d4; }
  #setupNote { min-height: 1.6em; color: #e6e0d4; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <select id="mode" aria-label="Show">
    <option value="map">Map</option>
    <option value="model">Model</option>
  </select>
  <select id="pick" aria-label="Level or model"></select>
  <button id="fly" type="button">Fly</button>
  <button id="forget" type="button" hidden>Forget game files</button>
  <span id="status"></span>
  <span id="error"></span>
</header>
<div id="stage">
  <div id="frame">
    <div id="hud" hidden>
      <canvas id="hudBar" width="320" height="64"></canvas>
      <canvas id="hudText" width="320" height="64"></canvas>
    </div>
    <div id="crosshair" hidden></div>
    <div id="setup" hidden>
      <div class="card">
        <h1>Game files needed</h1>
        <p>This plays the original Terminal Velocity data. Choose or drop the two archives from the
          game folder: <code>STARTUP.POD</code> and <code>CDROM.POD</code>. They stay in this browser;
          nothing is uploaded anywhere.</p>
        <p><input id="setupFiles" type="file" accept=".pod,.POD" multiple></p>
        <div id="setupNote"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="src/viewer.js"></script>
</body>
</html>
